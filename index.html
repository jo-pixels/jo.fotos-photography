<script>
  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111110';
    ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = '#eeeee8';
    ctx.font = 'bold 42px Archivo, Helvetica Neue, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('J', 32, 34);
    const link = document.createElement('link');
    link.rel = 'icon'; link.type = 'image/png';
    link.href = canvas.toDataURL();
    document.head.appendChild(link);
  });
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #fafaf8;
  --text: #1a1a18;
  --muted: #999993;
  --border: #e8e8e4;
  --overlay: rgba(10,10,8,0.95);
  --toggle-bg: transparent;
}
[data-theme="dark"] {
  --bg: #111110;
  --text: #eeeee8;
  --muted: #666660;
  --border: #2a2a28;
  --overlay: rgba(0,0,0,0.96);
}

html { scroll-behavior: smooth; background: var(--bg); transition: background .3s; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 300;
  min-height: 100vh;
  transition: background .3s, color .3s;
}

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 64px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s;
}
nav.scrolled { border-color: var(--border); }

.brand {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: .85rem;
  font-weight: 400;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--text);
  user-select: none;
  cursor: default;
  transition: color .3s;
  white-space: nowrap;
}

.nav-btn {
  background: none;
  border: none;
  cursor: pointer;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  border-radius: 50%;
  transition: color .2s, background .2s;
  padding: 0;
  flex-shrink: 0;
  text-decoration: none;
}
.nav-btn:hover { color: var(--text); background: var(--border); }
.nav-btn svg { width: 18px; height: 18px; }

.nav-btn { position: relative; }
.icon-sun, .icon-moon { position: absolute; transition: opacity .25s, transform .25s; }
[data-theme="light"] .icon-sun  { opacity: 1; transform: rotate(0deg); }
[data-theme="light"] .icon-moon { opacity: 0; transform: rotate(-45deg); }
[data-theme="dark"]  .icon-sun  { opacity: 0; transform: rotate(45deg); }
[data-theme="dark"]  .icon-moon { opacity: 1; transform: rotate(0deg); }

.gallery {
  padding: 24px 20px 60px;
  columns: 3;
  column-gap: 10px;
}
@media (max-width: 860px)  { .gallery { columns: 2; column-gap: 8px; padding: 16px 12px 48px; } }
@media (max-width: 480px)  { .gallery { columns: 2; column-gap: 6px; padding: 12px 8px 40px; } }

.photo-item {
  break-inside: avoid;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  background: var(--border);
  animation: fadeUp .45s ease both;
}
@media (max-width: 860px) { .photo-item { margin-bottom: 8px; } }
@media (max-width: 480px) { .photo-item { margin-bottom: 6px; } }

.photo-item img, #lbImg {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  pointer-events: auto;
}

.photo-item img {
  width: 100%;
  display: block;
  transition: transform .5s cubic-bezier(.25,.46,.45,.94);
}
@media (hover: hover) {
  .photo-item:hover img { transform: scale(1.03); }
  .photo-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.2) 0%, transparent 55%);
    opacity: 0;
    transition: opacity .3s;
  }
  .photo-item:hover::after { opacity: 1; }
}

.lightbox {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; animation: fadeIn .2s ease; }

.lb-img-wrap {
  position: relative;
  max-width: calc(100vw - 120px);
  max-height: calc(100vh - 60px);
  display: flex;
  align-items: center;
  justify-content: center;
}
@media (max-width: 600px) {
  .lb-img-wrap {
    max-width: 100vw;
    max-height: calc(100vh - 100px);
  }
}

.lb-img-wrap img {
  max-width: 100%;
  max-height: calc(100vh - 60px);
  display: block;
  object-fit: contain;
  border-radius: 1px;
  transition: opacity .18s ease, transform .18s ease;
}
@media (max-width: 600px) {
  .lb-img-wrap img { max-height: calc(100vh - 100px); }
}

.lb-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.8);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background .2s, transform .15s;
  z-index: 1010;
}
.lb-arrow:hover { background: rgba(255,255,255,.15); transform: translateY(-50%) scale(1.07); }
.lb-arrow.prev { left: 16px; }
.lb-arrow.next { right: 16px; }
.lb-arrow svg { width: 20px; height: 20px; }
@media (max-width: 480px) {
  .lb-arrow { width: 38px; height: 38px; bottom: 20px; top: auto; transform: none; }
  .lb-arrow:hover { transform: scale(1.07); }
  .lb-arrow.prev { left: calc(50% - 52px); }
  .lb-arrow.next { right: calc(50% - 52px); }
}

.lb-close {
  position: fixed;
  top: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.75);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background .2s;
  z-index: 1010;
}
.lb-close:hover { background: rgba(255,255,255,.15); }
.lb-close svg { width: 16px; height: 16px; }

.lb-exif-btn {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  background: rgba(20,20,18,.55);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.8);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background .2s, color .2s, opacity .2s;
  z-index: 20;
  opacity: 0;
}
.lb-exif-btn.visible { display: flex; opacity: 1; }
.lb-exif-btn:hover, .lb-exif-btn.active { background: rgba(20,20,18,.85); color: #fff; }
.lb-exif-btn svg { width: 15px; height: 15px; }

.lb-exif-panel {
  position: absolute;
  bottom: 50px;
  right: 10px;
  background: rgba(20,20,18,.9);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.14);
  padding: 12px 16px;
  min-width: 148px;
  max-width: min(240px, calc(100vw - 40px));
  opacity: 0;
  transform: translateY(4px);
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 20;
}
.lb-exif-panel.show { opacity: 1; transform: translateY(0); }
.lb-exif-row {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  font-size: .68rem;
  letter-spacing: .04em;
  padding: 3px 0;
  color: rgba(255,255,255,.55);
  white-space: nowrap;
}
.lb-exif-row span:last-child { color: rgba(255,255,255,.9); }
.lb-exif-row.camera {
  white-space: normal;
  border-bottom: 1px solid rgba(255,255,255,.14);
  padding-bottom: 7px;
  margin-bottom: 4px;
}
.lb-exif-row.camera span:last-child { text-align: right; }
.lb-exif-row.camera-plain { white-space: normal; }
.lb-exif-row.camera-plain span:last-child { text-align: right; }

.status {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 65vh;
  gap: 14px;
  color: var(--muted);
  font-size: .78rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.spinner {
  width: 22px;
  height: 22px;
  border: 1.5px solid var(--border);
  border-top-color: var(--muted);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

.load-more-wrap {
  display: flex;
  justify-content: center;
  padding: 8px 0 64px;
}
.load-more-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: .7rem;
  font-weight: 400;
  letter-spacing: .22em;
  text-transform: uppercase;
  padding: 13px 36px;
  cursor: pointer;
  transition: border-color .2s, color .2s, background .2s;
}
.load-more-btn:hover {
  border-color: var(--text);
  color: var(--text);
}

.copyright-popup {
  position: fixed;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 12px 18px;
  font-size: .68rem;
  letter-spacing: .12em;
  color: var(--muted);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .2s, transform .2s;
  z-index: 9999;
  white-space: nowrap;
}
.copyright-popup.show {
  opacity: 1;
  transform: translateY(0);
}

.copyright-footer {
  text-align: center;
  padding: 24px;
  font-size: .65rem;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--border);
  transition: color .3s;
}

@keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes spin    { to { transform: rotate(360deg) } }
</style>
</head>

      <path stroke-linecap="round" d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>

        <path stroke-linecap="round" stroke-linejoin="round" d="M4 8a2 2 0 012-2h1.2a2 2 0 001.6-.8l.4-.6a2 2 0 011.6-.8h2.4a2 2 0 011.6.8l.4.6a2 2 0 001.6.8H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"/>

<script>
  const copyrightPopup = document.getElementById('copyrightPopup');
  let popupTimer;

  function showCopyrightPopup(x, y) {
    copyrightPopup.style.left = '0';
    copyrightPopup.style.top  = '0';
    copyrightPopup.style.visibility = 'hidden';
    copyrightPopup.classList.add('show');
    const pw = copyrightPopup.offsetWidth;
    const ph = copyrightPopup.offsetHeight;
    const clampedX = Math.min(x, window.innerWidth - pw - 8);
    const clampedY = Math.min(y, window.innerHeight - ph - 8);
    copyrightPopup.style.left = `${Math.max(8, clampedX)}px`;
    copyrightPopup.style.top  = `${Math.max(8, clampedY)}px`;
    copyrightPopup.style.visibility = 'visible';
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => copyrightPopup.classList.remove('show'), 2500);
  }

  document.addEventListener('contextmenu', e => {
    if (e.target.tagName === 'IMG') {
      e.preventDefault();
      showCopyrightPopup(e.clientX + 12, e.clientY + 12);
    }
  });

  let longPressTimer;
  document.addEventListener('touchstart', e => {
    if (e.target.tagName === 'IMG') {
      const touch = e.touches[0];
      longPressTimer = setTimeout(() => {
        showCopyrightPopup(
          Math.min(touch.clientX + 12, window.innerWidth - 260),
          Math.min(touch.clientY + 12, window.innerHeight - 60)
        );
      }, 500);
    }
  }, { passive: true });
  document.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
  document.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });

  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });

  const html    = document.documentElement;
  const toggle  = document.getElementById('themeToggle');
  const saved   = localStorage.getItem('theme');
  const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved) html.dataset.theme = saved;
  else if (prefers) html.dataset.theme = 'dark';

  toggle.addEventListener('click', () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme = next;
    localStorage.setItem('theme', next);
  });

  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  const gallery      = document.getElementById('gallery');
  const status       = document.getElementById('status');
  const lightbox     = document.getElementById('lightbox');
  const lbImg        = document.getElementById('lbImg');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const loadMoreBtn  = document.getElementById('loadMoreBtn');
  const lbExifBtn    = document.getElementById('lbExifBtn');
  const lbExifPanel  = document.getElementById('lbExifPanel');

  const BATCH = 24;
  let photos = [];
  let shown  = 0;
  let currentIndex = 0;

  const base = document.baseURI.replace(/\/[^/]*$/, '/');

  async function loadPhotos() {
    const timeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('timeout')), 8000)
    );
    try {
      const res = await Promise.race([fetch(base + 'photos.json'), timeout]);
      const list = await res.json();
      photos = list.map(p => base + p);
      photos = photos.sort(() => Math.random() - 0.5);
      if (photos.length === 0) {
        status.innerHTML = '<span>No photos yet</span>';
      } else {
        status.style.display = 'none';
        showBatch();
      }
    } catch {
      status.innerHTML = '<span>Could not load photos. Try refreshing.</span>';
    }
  }

  function showBatch() {
    const next = Math.min(shown + BATCH, photos.length);
    for (let i = shown; i < next; i++) renderItem(photos[i], i);
    shown = next;
    loadMoreWrap.style.display = shown < photos.length ? 'flex' : 'none';
  }

  loadMoreBtn.addEventListener('click', showBatch);

  function renderItem(src, index) {
    const wrap = document.createElement('div');
    wrap.className = 'photo-item';
    wrap.dataset.index = index;
    wrap.style.animationDelay = `${(index % 9) * 40}ms`;

    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';

    wrap.appendChild(img);
    wrap.addEventListener('click', () => openLightbox(index));
    gallery.appendChild(wrap);
  }

  function openLightbox(index) {
    currentIndex = index;
    showPhoto();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    hideExifBtn();
  }

  function preload(index) {
    if (index >= 0 && index < photos.length) {
      const img = new Image();
      img.src = photos[index];
    }
  }

  function showPhoto() {
    lbImg.style.opacity = '0';
    lbImg.style.transform = 'scale(.97)';
    setTimeout(() => {
      lbImg.src = photos[currentIndex];
      lbImg.style.opacity = '1';
      lbImg.style.transform = 'scale(1)';
      preload(currentIndex + 1);
      preload(currentIndex - 1);
    }, 80);
    const single = photos.length === 1;
    document.getElementById('lbPrev').style.visibility = single ? 'hidden' : 'visible';
    document.getElementById('lbNext').style.visibility = single ? 'hidden' : 'visible';
    loadExif(photos[currentIndex]);
  }

  const exifCache = new Map();

  const TYPE_SIZES = { 1:1, 2:1, 3:2, 4:4, 5:8, 6:1, 7:1, 8:2, 9:4, 10:8, 11:4, 12:8 };

  function readTiffValue(view, tiffStart, fieldOffset, type, count, little) {
    const size = TYPE_SIZES[type] || 1;
    const totalBytes = size * count;
    const dataOffset = totalBytes <= 4 ? fieldOffset : tiffStart + view.getUint32(fieldOffset, little);
    if (type === 2) {
      let str = '';
      for (let i = 0; i < count - 1; i++) str += String.fromCharCode(view.getUint8(dataOffset + i));
      return str.replace(/\0+$/, '').trim();
    }
    if (type === 5 || type === 10) {
      const num = type === 5 ? view.getUint32(dataOffset, little) : view.getInt32(dataOffset, little);
      const den = type === 5 ? view.getUint32(dataOffset + 4, little) : view.getInt32(dataOffset + 4, little);
      return den === 0 ? 0 : num / den;
    }
    if (type === 3) return view.getUint16(dataOffset, little);
    if (type === 8) return view.getInt16(dataOffset, little);
    if (type === 4) return view.getUint32(dataOffset, little);
    if (type === 9) return view.getInt32(dataOffset, little);
    return view.getUint8(dataOffset);
  }

  function readIFD(view, tiffStart, ifdOffset, little) {
    const tags = {};
    if (ifdOffset + 2 > view.byteLength) return tags;
    const numEntries = view.getUint16(ifdOffset, little);
    for (let i = 0; i < numEntries; i++) {
      const entryOffset = ifdOffset + 2 + i * 12;
      if (entryOffset + 12 > view.byteLength) break;
      const tag = view.getUint16(entryOffset, little);
      const type = view.getUint16(entryOffset + 2, little);
      const count = view.getUint32(entryOffset + 4, little);
      try {
        tags[tag] = readTiffValue(view, tiffStart, entryOffset + 8, type, count, little);
      } catch {}
    }
    return tags;
  }

  function readFourCC(view, offset) {
    let s = '';
    for (let i = 0; i < 4; i++) s += String.fromCharCode(view.getUint8(offset + i));
    return s;
  }

  function readTiffFrom(view, tiffStart) {
    if (tiffStart + 8 > view.byteLength) return null;
    const byteOrder = view.getUint16(tiffStart);
    const little = byteOrder === 0x4949;
    if (byteOrder !== 0x4949 && byteOrder !== 0x4D4D) return null;
    const ifd0Offset = view.getUint32(tiffStart + 4, little);
    const ifd0 = readIFD(view, tiffStart, tiffStart + ifd0Offset, little);

    const result = {};
    if (ifd0[0x010F]) result.Make = ifd0[0x010F];
    if (ifd0[0x0110]) result.Model = ifd0[0x0110];
    if (ifd0[0x8769]) {
      const exifIFD = readIFD(view, tiffStart, tiffStart + ifd0[0x8769], little);
      if (exifIFD[0x829A] !== undefined) result.ExposureTime = exifIFD[0x829A];
      if (exifIFD[0x829D] !== undefined) result.FNumber = exifIFD[0x829D];
      if (exifIFD[0x8827] !== undefined) result.ISO = exifIFD[0x8827];
      if (exifIFD[0x920A] !== undefined) result.FocalLength = exifIFD[0x920A];
      if (exifIFD[0x9209] !== undefined) result.Flash = exifIFD[0x9209];
      if (exifIFD[0xA434]) result.LensModel = exifIFD[0xA434];
      if (exifIFD[0xA433]) result.LensMake = exifIFD[0xA433];
    }
    return result;
  }

  function parseJpegExif(view) {
    let offset = 2;
    while (offset + 4 <= view.byteLength) {
      const marker = view.getUint16(offset);
      if ((marker & 0xFF00) !== 0xFF00) break;
      if (marker === 0xFFD9 || (marker >= 0xFFD0 && marker <= 0xFFD7)) { offset += 2; continue; }
      const length = view.getUint16(offset + 2);
      if (marker === 0xFFE1 && offset + 4 + 6 <= view.byteLength && readFourCC(view, offset + 4) === 'Exif') {
        return readTiffFrom(view, offset + 4 + 6);
      }
      offset += 2 + length;
    }
    return null;
  }

  function parseWebpExif(view) {
    let offset = 12;
    while (offset + 8 <= view.byteLength) {
      const fourCC = readFourCC(view, offset);
      const chunkSize = view.getUint32(offset + 4, true);
      const dataStart = offset + 8;
      if (fourCC === 'EXIF') {
        const hasPrefix = dataStart + 6 <= view.byteLength && readFourCC(view, dataStart) === 'Exif'
          && view.getUint8(dataStart + 4) === 0 && view.getUint8(dataStart + 5) === 0;
        return readTiffFrom(view, hasPrefix ? dataStart + 6 : dataStart);
      }
      offset = dataStart + chunkSize + (chunkSize % 2);
    }
    return null;
  }

  function parseExif(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength < 12) return null;
    if (view.getUint16(0) === 0xFFD8) return parseJpegExif(view);
    if (readFourCC(view, 0) === 'RIFF' && readFourCC(view, 8) === 'WEBP') return parseWebpExif(view);
    return null;
  }

  function formatShutter(exp) {
    if (exp == null || isNaN(exp)) return null;
    if (exp >= 1) return `${exp % 1 === 0 ? exp : exp.toFixed(1)}s`;
    const denom = Math.round(1 / exp);
    return `1/${denom}s`;
  }
  function formatAperture(f) {
    if (f == null || isNaN(f)) return null;
    return `f/${f % 1 === 0 ? f : f.toFixed(1)}`;
  }
  function formatISO(iso) {
    if (iso == null) return null;
    return `ISO ${iso}`;
  }
  function formatFocal(fl) {
    if (fl == null || isNaN(fl)) return null;
    return `${fl % 1 === 0 ? fl : fl.toFixed(1)}mm`;
  }
  function formatFlash(flash) {
    if (flash == null) return null;
    if (typeof flash === 'string') {
      return /did not fire|no flash/i.test(flash) ? 'Off' : 'Fired';
    }
    if (typeof flash === 'number') return (flash & 1) ? 'Fired' : 'Off';
    return null;
  }
  function formatCamera(make, model) {
    make = (make || '').trim();
    model = (model || '').trim();
    if (!make && !model) return null;
    if (!model) return make;
    if (!make) return model;
    return model.toLowerCase().startsWith(make.toLowerCase()) ? model : `${make} ${model}`;
  }
  function formatLens(lensMake, lensModel) {
    lensModel = (lensModel || '').trim();
    if (!lensModel) return null;
    if (/^n\/a$/i.test(lensModel)) return null;
    return formatCamera(lensMake, lensModel);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function renderExifPanel(fields) {
    const headerLabels = new Set(['Camera', 'Lens']);
    let lastHeaderIndex = -1;
    fields.forEach(([label], i) => { if (headerLabels.has(label)) lastHeaderIndex = i; });

    lbExifPanel.innerHTML = fields
      .map(([label, value], i) => {
        const cls = headerLabels.has(label) ? (i === lastHeaderIndex ? ' camera' : ' camera-plain') : '';
        return `<div class="lb-exif-row${cls}"><span>${escapeHtml(label)}</span><span>${escapeHtml(value)}</span></div>`;
      })
      .join('');
  }

  function hideExifBtn() {
    lbExifBtn.classList.remove('visible', 'active');
    lbExifPanel.classList.remove('show');
    lbExifPanel.innerHTML = '';
  }

  async function loadExif(src) {
    hideExifBtn();
    const loadingSrc = src;
    try {
      let data = exifCache.get(src);
      if (data === undefined) {
        const res = await fetch(src);
        const buffer = await res.arrayBuffer();
        data = parseExif(buffer);
        exifCache.set(src, data || null);
      }
      if (loadingSrc !== photos[currentIndex]) return;
      if (!data) return;

      const fields = [];
      const camera = formatCamera(data.Make, data.Model);
      const lens = formatLens(data.LensMake, data.LensModel);
      const shutter = formatShutter(data.ExposureTime);
      const aperture = formatAperture(data.FNumber);
      const iso = formatISO(data.ISO);
      const focal = formatFocal(data.FocalLength);
      const flash = formatFlash(data.Flash);

      if (camera) fields.push(['Camera', camera]);
      if (lens) fields.push(['Lens', lens]);
      if (shutter) fields.push(['Shutter', shutter]);
      if (aperture) fields.push(['Aperture', aperture]);
      if (iso) fields.push(['ISO', data.ISO]);
      if (focal) fields.push(['Focal Length', focal]);
      if (flash) fields.push(['Flash', flash]);

      if (fields.length === 0) return;
      renderExifPanel(fields);
      lbExifBtn.classList.add('visible');
    } catch {
    }
  }

  function toggleExifPanel() {
    const showing = lbExifPanel.classList.toggle('show');
    lbExifBtn.classList.toggle('active', showing);
  }

  lbExifBtn.addEventListener('click', e => {
    e.stopPropagation();
    toggleExifPanel();
  });
  lbExifBtn.addEventListener('mouseenter', () => {
    if (window.matchMedia('(hover: hover)').matches) {
      lbExifPanel.classList.add('show');
      lbExifBtn.classList.add('active');
    }
  });
  lbExifBtn.addEventListener('mouseleave', () => {
    if (window.matchMedia('(hover: hover)').matches) {
      lbExifPanel.classList.remove('show');
      lbExifBtn.classList.remove('active');
    }
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + photos.length) % photos.length;
    showPhoto();
  });
  document.getElementById('lbNext').addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % photos.length;
    showPhoto();
  });

  lightbox.addEventListener('click', e => {
    if (e.target === lightbox) closeLightbox();
    if (e.target !== lbExifBtn && !lbExifBtn.contains(e.target) && e.target !== lbExifPanel) {
      lbExifPanel.classList.remove('show');
      lbExifBtn.classList.remove('active');
    }
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + photos.length) % photos.length; showPhoto(); }
    if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % photos.length; showPhoto(); }
    if (e.key === 'Escape')     closeLightbox();
  });

  let tx = 0;
  lightbox.addEventListener('touchstart', e => tx = e.changedTouches[0].clientX, { passive: true });
  lightbox.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) < 40) return;
    currentIndex = dx < 0
      ? (currentIndex + 1) % photos.length
      : (currentIndex - 1 + photos.length) % photos.length;
    showPhoto();
  });

  loadPhotos();
</script>
</body>
</html>
